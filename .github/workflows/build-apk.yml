name: Build Pappa Pronta Android APK (Camera + Health Connect)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Capacitor Android APK with Health Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets (www) & Capacitor 8 + Health Connect Plugin
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          if [ -d icons ]; then cp -r icons www/; fi

          cat << 'EOF' > package.json
          {
            "name": "pappa-pronta",
            "version": "3.1.0",
            "private": true,
            "description": "Pappa Pronta — Multi-User Nutrition, Scanner & Google Health Connect"
          }
          EOF

          npm install --no-audit --no-fund \
            "@capacitor/core@8.6.2" \
            "@capacitor/cli@8.6.2" \
            "@capacitor/android@8.6.2" \
            "@capgo/capacitor-health@8.13.0"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "it.pappapronta.app",
            "appName": "Pappa Pronta",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure minSdkVersion 26 & CAMERA Permission
        run: |
          node -e '
            const fs = require("fs");

            // 1. Align minSdkVersion = 26 in variables.gradle (required by androidx.health.connect)
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 26");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // 2. Inject CAMERA permission into app AndroidManifest.xml
            // (Health Connect permissions, queries & rationale activities are merged automatically by @capgo/capacitor-health)
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const additions = [];
            if (!xml.includes("android.permission.CAMERA")) {
              additions.push("    <uses-permission android:name=\"android.permission.CAMERA\" />");
            }
            if (!xml.includes("android.hardware.camera")) {
              additions.push("    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />");
              additions.push("    <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />");
            }
            if (additions.length > 0) {
              xml = xml.replace("</manifest>", additions.join("\n") + "\n</manifest>");
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '
          grep -q "minSdkVersion = 26" android/variables.gradle
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml
          echo "Verified minSdkVersion 26 and android.permission.CAMERA"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
