name: Build Pappa Pronta Android APK (Icona + Camera + Health Connect + Google Auth)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Capacitor Android APK (Pappa Pronta v3.2)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Persistent Android Debug Keystore across Builds
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: pappa-pronta-signing-keystore-v1

      - name: Restore & Validate Firebase Debug Keystore (for Consistent APK Updates & Google Auth)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t"' | base64 --decode > ~/.android/debug.keystore
            if keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "✅ Chiave di firma registrata su Firebase validata con successo."
            else
              echo "⚠️ Secret ANDROID_DEBUG_KEYSTORE_BASE64 non valido: rigenero debug.keystore standard."
              rm -f ~/.android/debug.keystore
            fi
          elif [ -f ~/.android/debug.keystore ]; then
            echo "✅ Chiave di firma persistente ripristinata dalla cache GitHub Actions."
          else
            echo "ℹ️ Nessuna chiave precedente trovata: Gradle ne genererà una e la salverà in cache."
          fi

      - name: Prepare Web Assets (www) & Capacitor 8 + Health Connect + Firebase Auth
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          if [ -d icons ]; then cp -r icons www/; fi

          cat << 'EOF' > package.json
          {
            "name": "pappa-pronta",
            "version": "3.3.0",
            "private": true,
            "description": "Pappa Pronta — Multi-User Nutrition, Scanner, Google Health Connect & Native Google Auth"
          }
          EOF

          npm install --no-audit --no-fund \
            "@capacitor/core@8.6.2" \
            "@capacitor/cli@8.6.2" \
            "@capacitor/android@8.6.2" \
            "@capacitor/app@8.0.0" \
            "@capgo/capacitor-health@8.13.0" \
            "@capacitor-firebase/authentication@8.6.0" \
            "firebase@^12.6.0" \
            "sharp"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "it.pappapronta.app",
            "appName": "Pappa Pronta",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF

          npx cap add android
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "Copied google-services.json to android/app/google-services.json"
          fi
          npx cap sync android

      - name: Generate Official Pappa Pronta Android Launcher Icons (Adaptive + Round + Splash)
        run: |
          cat << 'EOF' > gen-android-icons.cjs
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const resDir = path.resolve('android/app/src/main/res');
            const densities = [
              { dir: 'mipmap-mdpi', launcher: 48, fg: 108 },
              { dir: 'mipmap-hdpi', launcher: 72, fg: 162 },
              { dir: 'mipmap-xhdpi', launcher: 96, fg: 216 },
              { dir: 'mipmap-xxhdpi', launcher: 144, fg: 324 },
              { dir: 'mipmap-xxxhdpi', launcher: 192, fg: 432 }
            ];

            const makeSquareSvg = (sz) => Buffer.from(
              `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 64 64">` +
              `<rect width="64" height="64" rx="14" fill="#1B6B46"/>` +
              `<circle cx="32" cy="36" r="20" fill="#F6F7F4"/>` +
              `<path d="M15 35h34c-1.4 10-7.5 16-17 16s-15.6-6-17-16z" fill="#14231B"/>` +
              `<path d="M32 13c0 6.5-5 11.5-11.5 11.5 0-6.5 5-11.5 11.5-11.5zm2.5 2.5c5-3 11.5-1.2 14.2 3.8-5 3-11.5 1.2-14.2-3.8z" fill="#4ADE80"/>` +
              `</svg>`
            );

            const makeRoundSvg = (sz) => Buffer.from(
              `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 64 64">` +
              `<circle cx="32" cy="32" r="32" fill="#1B6B46"/>` +
              `<circle cx="32" cy="36" r="19" fill="#F6F7F4"/>` +
              `<path d="M16 35h32c-1.3 9.5-7 15-16 15s-14.7-5.5-16-15z" fill="#14231B"/>` +
              `<path d="M32 14c0 6-4.7 10.8-10.8 10.8 0-6 4.7-10.8 10.8-10.8zm2.4 2.4c4.7-2.8 10.8-1.1 13.4 3.6-4.7 2.8-10.8 1.1-13.4-3.6z" fill="#4ADE80"/>` +
              `</svg>`
            );

            const makeFgSvg = (sz) => Buffer.from(
              `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 108 108">` +
              `<g transform="translate(22, 22)">` +
              `<circle cx="32" cy="36" r="20" fill="#F6F7F4"/>` +
              `<path d="M15 35h34c-1.4 10-7.5 16-17 16s-15.6-6-17-16z" fill="#14231B"/>` +
              `<path d="M32 13c0 6.5-5 11.5-11.5 11.5 0-6.5 5-11.5 11.5-11.5zm2.5 2.5c5-3 11.5-1.2 14.2 3.8-5 3-11.5 1.2-14.2-3.8z" fill="#4ADE80"/>` +
              `</g></svg>`
            );

            for (const d of densities) {
              const outDir = path.join(resDir, d.dir);
              fs.mkdirSync(outDir, { recursive: true });
              await sharp(makeSquareSvg(d.launcher)).png().toFile(path.join(outDir, 'ic_launcher.png'));
              await sharp(makeRoundSvg(d.launcher)).png().toFile(path.join(outDir, 'ic_launcher_round.png'));
              await sharp(makeFgSvg(d.fg)).png().toFile(path.join(outDir, 'ic_launcher_foreground.png'));
            }

            fs.writeFileSync(
              path.join(resDir, 'values/ic_launcher_background.xml'),
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1B6B46</color>\n</resources>\n'
            );

            const adaptiveXml =
              '<?xml version="1.0" encoding="utf-8"?>\n' +
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n' +
              '    <background android:drawable="@color/ic_launcher_background"/>\n' +
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n' +
              '</adaptive-icon>\n';

            fs.writeFileSync(path.join(resDir, 'mipmap-anydpi-v26/ic_launcher.xml'), adaptiveXml);
            fs.writeFileSync(path.join(resDir, 'mipmap-anydpi-v26/ic_launcher_round.xml'), adaptiveXml);

            ['drawable-v24/ic_launcher_foreground.xml', 'drawable/ic_launcher_background.xml'].forEach((rel) => {
              const p = path.join(resDir, rel);
              if (fs.existsSync(p)) fs.unlinkSync(p);
            });

            const walkSplash = (dir) => {
              let list = [];
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, e.name);
                if (e.isDirectory()) list = list.concat(walkSplash(full));
                else if (e.name === 'splash.png') list.push(full);
              }
              return list;
            };

            for (const sp of walkSplash(resDir)) {
              const meta = await sharp(sp).metadata();
              const w = meta.width || 480;
              const h = meta.height || 800;
              const logoSz = Math.round(Math.min(w, h) * 0.34);
              const left = Math.round((w - logoSz) / 2);
              const top = Math.round((h - logoSz) / 2);
              const logoBuf = await sharp(makeFgSvg(logoSz)).png().toBuffer();
              await sharp({ create: { width: w, height: h, channels: 4, background: '#1B6B46' } })
                .composite([{ input: logoBuf, left, top }])
                .png()
                .toFile(sp + '.tmp');
              fs.renameSync(sp + '.tmp', sp);
            }
            console.log('Generated all Pappa Pronta Android launcher icons & splash screens.');
          })();
          EOF
          node gen-android-icons.cjs

      - name: Configure minSdkVersion 26, Auto-Increment versionCode, Google Auth & CAMERA Permission
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const runNum = parseInt(process.env.RUN_NUM || "1", 10) || 1;
            const verCode = 100 + runNum;
            const verName = "3.2." + runNum;

            // 1. Align minSdkVersion = 26 and enable rgcfaIncludeGoogle = true in variables.gradle
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 26");
              if (!vars.includes("rgcfaIncludeGoogle")) {
                vars = vars.replace(
                  /}\s*$/,
                  "    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = \x271.3.0\x27\n    androidxCredentialsPlayServicesAuthVersion = \x271.3.0\x27\n}\n"
                );
              }
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // 2. Bump versionCode & versionName automatically in android/app/build.gradle
            const appGradlePath = "android/app/build.gradle";
            if (fs.existsSync(appGradlePath)) {
              let ag = fs.readFileSync(appGradlePath, "utf8");
              ag = ag.replace(/versionCode\s+\d+/, "versionCode " + verCode);
              ag = ag.replace(/versionName\s+"[^"]*"/, "versionName \"" + verName + "\"");
              fs.writeFileSync(appGradlePath, ag, "utf8");
              console.log("Set APK versionCode=" + verCode + ", versionName=" + verName);
            }

            // 3. Inject pappapronta://auth Deep-Link Intent Filter & CAMERA permission into AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("android:scheme=\"pappapronta\"")) {
              const deepLinkFilter = [
                "            <intent-filter>",
                "                <action android:name=\"android.intent.action.VIEW\" />",
                "                <category android:name=\"android.intent.category.DEFAULT\" />",
                "                <category android:name=\"android.intent.category.BROWSABLE\" />",
                "                <data android:scheme=\"pappapronta\" android:host=\"auth\" />",
                "            </intent-filter>"
              ].join("\n");
              xml = xml.replace("</activity>", deepLinkFilter + "\n        </activity>");
            }
            const additions = [];
            if (!xml.includes("android.permission.CAMERA")) {
              additions.push("    <uses-permission android:name=\"android.permission.CAMERA\" />");
            }
            if (!xml.includes("android.hardware.camera")) {
              additions.push("    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />");
              additions.push("    <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />");
            }
            if (additions.length > 0) {
              xml = xml.replace("</manifest>", additions.join("\n") + "\n</manifest>");
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '
          grep -q "minSdkVersion = 26" android/variables.gradle
          grep -q "rgcfaIncludeGoogle = true" android/variables.gradle
          grep -q "android:scheme=\"pappapronta\"" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Build Signed Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK Signing Certificate & Rename Cleanly
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pappa-pronta.apk
          keytool -printcert -jarfile pappa-pronta.apk | grep -E "SHA1:|SHA256:" || true
          ls -lh pappa-pronta.apk

      - name: Upload APK Zip Artifact (GitHub Actions)
        uses: actions/upload-artifact@v7
        with:
          name: PappaPronta-APK-Estrai-ZIP
          path: pappa-pronta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct 1-Tap pappa-pronta.apk in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest pappa-pronta.apk --clobber
            gh release edit latest --title "Pappa Pronta APK Android (Build #${{ github.run_number }})" --notes "Scarica direttamente **pappa-pronta.apk** qui sotto (senza estrarre file ZIP). Se avevi installato una versione precedente con firma diversa, disinstalla una sola volta la vecchia app prima di installare questa."
          else
            gh release create latest pappa-pronta.apk --title "Pappa Pronta APK Android (Build #${{ github.run_number }})" --notes "Scarica direttamente **pappa-pronta.apk** qui sotto (senza estrarre file ZIP). Se avevi installato una versione precedente con firma diversa, disinstalla una sola volta la vecchia app prima di installare questa."
          fi
